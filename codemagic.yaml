
workflows:
  ios-unsigned-ipa:
    name: Chibi Gang War - unsigned IPA for ESign
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Build app without signing
        script: |
          xcodebuild \
            -project ChibiGangWar.xcodeproj \
            -scheme ChibiGangWar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ChibiGangWar.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload ChibiGangWar-unsigned.ipa
    artifacts:
      - ChibiGangWar-unsigned.ipa
      - build/Build/Products/Release-iphoneos/ChibiGangWar.app
