name: name: ChibiGangWar

options:
  bundleIdPrefix: com.chibigangwar
  deploymentTarget:
    iOS: "15.0"

targets:
  ChibiGangWar:
    type: application
    platform: iOS
    sources:
      - ChibiGangWar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chibigangwar.vn
        PRODUCT_NAME: ChibiGangWar
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Chibi Gang War"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
